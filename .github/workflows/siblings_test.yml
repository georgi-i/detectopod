name: Siblings Test (read-only)

# Experiment: for domains already in the feed, ask urlscan.io which OTHER hostnames it has
# seen under the same registrable domain. Prints a report and uploads it as an artifact.
# It never commits and never touches feed/.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'How many registrable domains to check'
        default: '15'
      domains:
        description: 'Extra registrable domains to check first (space separated)'
        default: 'order401-20.shop'

permissions:
  contents: read

jobs:
  siblings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - run: python -m pip install -r detection/requirements.txt

    - name: Look up siblings (read-only)
      env:
        URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
        LIMIT: ${{ inputs.limit }}
        DOMAINS: ${{ inputs.domains }}
        PYTHONUNBUFFERED: '1'
      run: |
        # inputs go through env vars (never interpolated into the script) to avoid injection
        python detection/siblings.py --limit "$LIMIT" --domains $DOMAINS | tee siblings.txt

    - name: Job summary
      if: always()
      run: |
        echo '### Siblings test (read-only)' >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat siblings.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo 'no output' >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: siblings-report
        path: |
          siblings_report.json
          siblings.txt
        if-no-files-found: ignore
