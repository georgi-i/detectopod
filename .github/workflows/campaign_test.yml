name: Campaign Test - Eurovision 2027 (read-only)

# Trial of the temporary Eurovision 2027 campaign: collects candidate domains from
# urlscan.io and crt.sh, checks for a Bulgarian (/bg) page and prints a report.
# It never commits and never touches feed/.

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Look back this many days'
        default: '30'
      probe:
        description: 'GET /bg/ on name matches that have no /bg URL yet'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - run: python -m pip install -r detection/requirements.txt

    - name: Run the campaign trial (read-only)
      env:
        URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
        DAYS: ${{ inputs.days }}
        PROBE: ${{ inputs.probe }}
        PYTHONUNBUFFERED: '1'
      run: |
        # inputs go through env vars (never interpolated into the script) to avoid injection
        FLAG=""
        if [[ "$PROBE" == "true" ]]; then FLAG="--probe"; fi
        python detection/campaigns.py --days "$DAYS" $FLAG | tee campaign.txt

    - name: Job summary
      if: always()
      run: |
        echo '### Eurovision 2027 campaign trial (read-only)' >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat campaign.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo 'no output' >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: campaign-report
        path: |
          campaign_report.json
          campaign.txt
        if-no-files-found: ignore
