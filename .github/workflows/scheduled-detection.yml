name: Scheduled Detection

on:
  schedule:
    # Run every 20 minutes to maximize coverage within free tier limits
    - cron: '*/20 * * * *'
  # Allow manual trigger for testing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f detection/requirements.txt ]; then pip install -r detection/requirements.txt; fi
        
    - name: Run detection script
      run: |
        # Run for 900 seconds (15 minutes) - leaving 5 min buffer for setup/commit
        python detection/detectopod.py --duration 900
        
    - name: Check for changes
      id: check_changes
      run: |
        if [[ -n $(git status -s feed.json) ]]; then
          echo "has_changes=true" >> $GITHUB_OUTPUT
        else
          echo "has_changes=false" >> $GITHUB_OUTPUT
        fi
        
    - name: Commit and push changes
      if: steps.check_changes.outputs.has_changes == 'true'
      run: |
        git config --global user.name 'Detectopod Bot'
        git config --global user.email 'bot@detectopod'
        git add feed.json
        git commit -m "Update threat feed [skip ci]"
        git push
