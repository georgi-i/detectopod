name: Scheduled Detection

on:
  schedule:
    # Run every 20 minutes to maximize coverage within free tier limits
    - cron: '*/20 * * * *'
  # Allow manual trigger for testing
  workflow_dispatch:

# Prevent multiple workflows from running at the same time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # Safety timeout

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        echo "Installing dependencies from requirements.txt..."
        cat detection/requirements.txt
        python -m pip install -r detection/requirements.txt
        # Install cryptography for direct CT log querying
        python -m pip install cryptography
        echo "Verifying installations..."
        python -c "import requests; print(f'requests {requests.__version__} installed')"
        python -c "import cryptography; print(f'cryptography {cryptography.__version__} installed')"

    - name: Run detection script with all sources
      run: |
        # Use polling mode with ALL sources: urlscan.io, Google CT, and Cloudflare CT
        env:
          URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
        python detection/detectopod.py

    - name: Check for changes
      id: check_changes
      run: |
        if [[ -n $(git status -s feed/) ]]; then
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "Changes detected in feed directory"
          git status -s feed/
        else
          echo "has_changes=false" >> $GITHUB_OUTPUT
          echo "No changes detected"
        fi

    - name: Commit and push changes
      if: steps.check_changes.outputs.has_changes == 'true'
      run: |
        git config --global user.name 'Detectopod Bot'
        git config --global user.email 'bot@detectopod'
        
        # Pull latest changes first (rebase to avoid merge commits)
        git pull --rebase origin main || true
        
        git add feed/
        TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
        git commit -m "Update threat feed - $TIMESTAMP [skip ci]"
        
        # Push with retry logic
        max_retries=3
        retry_count=0
        
        while [ $retry_count -lt $max_retries ]; do
          if git push; then
            echo "✓ Successfully pushed changes"
            break
          else
            retry_count=$((retry_count + 1))
            if [ $retry_count -lt $max_retries ]; then
              echo "⚠️  Push failed, retrying in 5 seconds... (attempt $retry_count/$max_retries)"
              sleep 5
              git pull --rebase origin main || true
            else
              echo "❌ Failed to push after $max_retries attempts"
              exit 1
            fi
          fi
        done

    - name: Summary
      if: always()
      run: |
        echo "### Detection Run Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Mode**: Polling (urlscan.io + Google CT + Cloudflare CT)" >> $GITHUB_STEP_SUMMARY
        echo "- **Sources**: 3 (urlscan.io API, Google Argon logs, Cloudflare Nimbus logs)" >> $GITHUB_STEP_SUMMARY
        echo "- **Time**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Check if run stats exist
        if [[ -f feed/run_stats.json ]]; then
          CERTS=$(cat feed/run_stats.json | python -c "import sys, json; print(json.load(sys.stdin).get('certs_analyzed', 0))" 2>/dev/null || echo "0")
          DOMAINS=$(cat feed/run_stats.json | python -c "import sys, json; print(json.load(sys.stdin).get('domains_processed', 0))" 2>/dev/null || echo "0")
          NEW_FINDINGS=$(cat feed/run_stats.json | python -c "import sys, json; print(json.load(sys.stdin).get('new_findings', 0))" 2>/dev/null || echo "0")
          ELAPSED=$(cat feed/run_stats.json | python -c "import sys, json; print(json.load(sys.stdin).get('elapsed_time', 0))" 2>/dev/null || echo "0")

          echo "**📊 Analysis Stats:**" >> $GITHUB_STEP_SUMMARY
          echo "- Certificates analyzed: **$CERTS**" >> $GITHUB_STEP_SUMMARY
          echo "- Unique domains processed: **$DOMAINS**" >> $GITHUB_STEP_SUMMARY
          echo "- New suspicious domains found: **$NEW_FINDINGS** 🚨" >> $GITHUB_STEP_SUMMARY
          echo "- Runtime: **${ELAPSED}s**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        fi

        # Total entries in feed
        if [[ -f feed/phishing_feed.json ]]; then
          TOTAL_ENTRIES=$(cat feed/phishing_feed.json | python -c "import sys, json; print(len(json.load(sys.stdin)))" 2>/dev/null || echo "0")
          echo "**📋 Feed Status:**" >> $GITHUB_STEP_SUMMARY
          echo "- Total entries in threat feed: **$TOTAL_ENTRIES**" >> $GITHUB_STEP_SUMMARY

          # Show last 5 findings
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🔍 Recent Findings (last 5):**" >> $GITHUB_STEP_SUMMARY
          cat feed/phishing_feed.json | python -c "
          import sys, json
          data = json.load(sys.stdin)
          for entry in data[-5:]:
            print(f\"- {entry.get('domain', 'N/A')} (score: {entry.get('score', 0)}) - {entry.get('source', 'unknown')}\")
            " >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "- Unable to parse recent findings" >> $GITHUB_STEP_SUMMARY
        fi

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**🎯 Target Platforms Monitored:** Firebase, Heroku, Cloudflare Pages, Netlify, Vercel, and more..." >> $GITHUB_STEP_SUMMARY
