name: Scheduled Detection

on:
  schedule:
    # Run every 20 minutes to maximize coverage within free tier limits
    - cron: '*/20 * * * *'
  # Allow manual trigger for testing
  workflow_dispatch:

# Prevent multiple workflows from running at the same time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # Safety net: Kill job if script hangs > 20 mins
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Debug: List structure to confirm paths
        ls -R
        python -m pip install -r detection/requirements.txt
        # Debug: Confirm installation
        python -m pip list
        
    - name: Run detection script
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        # Run for 900 seconds (15 minutes) - leaving 5 min buffer for setup/commit
        # Run as module to ensure imports work correctly
        python -m detection.detectopod --duration 900
        
    - name: Check for changes
      id: check_changes
      run: |
        if [[ -n $(git status -s feed.json) ]]; then
          echo "has_changes=true" >> $GITHUB_OUTPUT
        else
          echo "has_changes=false" >> $GITHUB_OUTPUT
        fi
        
    - name: Commit and push changes
      if: steps.check_changes.outputs.has_changes == 'true'
      run: |
        git config --global user.name 'Detectopod Bot'
        git config --global user.email 'bot@detectopod'
        git add feed.json
        git commit -m "Update threat feed [skip ci]"
        git push
