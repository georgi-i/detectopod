name: Scheduled Detection

on:
  schedule:
    # Run every 20 minutes to maximize coverage within free tier limits
    - cron: '*/20 * * * *'
  # Allow manual trigger for testing
  workflow_dispatch:

# Prevent multiple workflows from running at the same time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # Safety timeout
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        echo "Installing dependencies from requirements.txt..."
        cat detection/requirements.txt
        python -m pip install -r detection/requirements.txt
        echo "Verifying requests installation..."
        python -c "import requests; print(f'requests {requests.__version__} installed successfully')"
        
    - name: Run detection script in polling mode
      run: |
        # Use polling mode with crt.sh (most reliable and comprehensive)
        # Run for 900 seconds (15 minutes) - leaving 5 min buffer for setup/commit
        python detection/detectopod.py --duration 900 --mode poll
        
    - name: Check for changes
      id: check_changes
      run: |
        if [[ -n $(git status -s feed.json) ]]; then
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "Changes detected in feed.json"
        else
          echo "has_changes=false" >> $GITHUB_OUTPUT
          echo "No changes detected"
        fi
        
    - name: Commit and push changes
      if: steps.check_changes.outputs.has_changes == 'true'
      run: |
        git config --global user.name 'Detectopod Bot'
        git config --global user.email 'bot@detectopod'
        git add feed.json
        TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
        git commit -m "Update threat feed - $TIMESTAMP [skip ci]"
        git push
        
    - name: Summary
      if: always()
      run: |
        echo "### Detection Run Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Mode**: Polling (crt.sh API)" >> $GITHUB_STEP_SUMMARY
        echo "- **Time**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Check if run stats exist
        if [[ -f run_stats.json ]]; then
          CERTS=$(cat run_stats.json | python -c "import sys, json; print(json.load(sys.stdin).get('certs_analyzed', 0))" 2>/dev/null || echo "0")
          DOMAINS=$(cat run_stats.json | python -c "import sys, json; print(json.load(sys.stdin).get('domains_processed', 0))" 2>/dev/null || echo "0")
          NEW_FINDINGS=$(cat run_stats.json | python -c "import sys, json; print(json.load(sys.stdin).get('new_findings', 0))" 2>/dev/null || echo "0")
          ELAPSED=$(cat run_stats.json | python -c "import sys, json; print(json.load(sys.stdin).get('elapsed_time', 0))" 2>/dev/null || echo "0")
          
          echo "**📊 Analysis Stats:**" >> $GITHUB_STEP_SUMMARY
          echo "- Certificates analyzed: **$CERTS**" >> $GITHUB_STEP_SUMMARY
          echo "- Unique domains processed: **$DOMAINS**" >> $GITHUB_STEP_SUMMARY
          echo "- New suspicious domains found: **$NEW_FINDINGS** 🚨" >> $GITHUB_STEP_SUMMARY
          echo "- Runtime: **${ELAPSED}s**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Total entries in feed
        if [[ -f feed.json ]]; then
          TOTAL_ENTRIES=$(cat feed.json | python -c "import sys, json; print(len(json.load(sys.stdin)))" 2>/dev/null || echo "0")
          echo "**📋 Feed Status:**" >> $GITHUB_STEP_SUMMARY
          echo "- Total entries in threat feed: **$TOTAL_ENTRIES**" >> $GITHUB_STEP_SUMMARY
        fi
