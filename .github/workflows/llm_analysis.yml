name: Weekly LLM Analysis

on:
  workflow_run:
    workflows: ["Scheduled Detection"]  # fires right after detection adds new domains
    types:
      - completed
  workflow_dispatch:  # Allow manual trigger
    inputs:
      max_analyze:
        description: 'Max domains to analyze this run'
        default: '100'
  # (no separate cron: it used to run a second time, 2h after the workflow_run trigger)

permissions:
  contents: write

concurrency:
  group: feed-writer
  cancel-in-progress: false

jobs:
  analyze:
    # workflow_run fires even when detection failed - only continue on success
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install requests

    - name: Run LLM analysis on recent detections
      id: analyze
      # llm_analyzer.py saves progress every 10 domains. If this step times out or
      # crashes, still commit what was analysed (steps below), then fail the job at
      # the end so the problem stays visible.
      timeout-minutes: 75
      continue-on-error: true
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        MAX_ANALYZE: ${{ inputs.max_analyze || '100' }}
        PYTHONUNBUFFERED: '1'  # without this a killed run shows no output at all
      run: |
        # --days 400 + UNKNOWN re-queue: drains the backlog of truncated analyses.
        # Known false positives (feed/false_positives.json) are skipped automatically.
        python detection/llm_analyzer.py --days 400 --max-analyze "${MAX_ANALYZE}" --min-score 75

    - name: Check for changes
      id: check_changes
      run: |
        if [[ -n $(git status -s feed/) ]]; then
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "LLM analysis added to feed"
        else
          echo "has_changes=false" >> $GITHUB_OUTPUT
          echo "No changes from LLM analysis"
        fi

    # Runs from any branch other than main (e.g. testing a PR) must NOT push:
    # the commit step below pushes to main and would drag the branch along.
    - name: Upload analysis result (non-main runs)
      if: github.ref != 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: feed-after-llm-analysis
        path: feed/

    - name: Commit analysis results
      if: github.ref == 'refs/heads/main' && steps.check_changes.outputs.has_changes == 'true'
      run: |
        git config --global user.name 'LLM Analyzer Bot'
        git config --global user.email 'llm-bot@detectopod'
        
        # 1. Stage the changes
        git add feed/
        
        # 2. Commit locally
        TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
        git commit -m "Add LLM analysis - $TIMESTAMP [skip ci]"
        
        # 3. Pull the very latest changes and put our commit on top
        git pull origin main --rebase --autostash
        
        # 4. Finally push
        git push origin main

    - name: Fail if the analysis step failed
      if: steps.analyze.outcome == 'failure'
      run: |
        echo "::error::LLM analysis step failed or timed out - partial results were committed"
        exit 1

    - name: Analysis Summary
      if: always()
      run: |
        echo "### LLM Analysis Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Model**: Gemini 3.5 Flash (Google AI Studio direct)" >> $GITHUB_STEP_SUMMARY
        echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Time**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [[ -f feed/llm_analysis_stats.json ]]; then
          ANALYZED=$(cat feed/llm_analysis_stats.json | python -c "import sys, json; print(json.load(sys.stdin).get('analyzed_count', 0))" 2>/dev/null || echo "0")
          HIGH_CONF=$(cat feed/llm_analysis_stats.json | python -c "import sys, json; print(json.load(sys.stdin).get('high_confidence', 0))" 2>/dev/null || echo "0")
          FALSE_POS=$(cat feed/llm_analysis_stats.json | python -c "import sys, json; print(json.load(sys.stdin).get('false_positives', 0))" 2>/dev/null || echo "0")
          ERRORS=$(cat feed/llm_analysis_stats.json | python -c "import sys, json; print(json.load(sys.stdin).get('errors', 0))" 2>/dev/null || echo "0")

          echo "**📊 Analysis Results:**" >> $GITHUB_STEP_SUMMARY
          echo "- Domains analyzed: **$ANALYZED**" >> $GITHUB_STEP_SUMMARY
          echo "- High confidence threats: **$HIGH_CONF** 🚨" >> $GITHUB_STEP_SUMMARY
          echo "- False positives removed: **$FALSE_POS** ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Errors: **$ERRORS**" >> $GITHUB_STEP_SUMMARY
        fi
