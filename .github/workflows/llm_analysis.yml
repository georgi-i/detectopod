name: Daily LLM Analysis

on:
  schedule:
    # Run once daily at 2 AM UTC (after day's detections)
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install requests

    - name: Run LLM analysis on recent detections
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      run: |
        python detection/llm_analyzer.py --days 1 --max-analyze 50 --min-score 75

    - name: Check for changes
      id: check_changes
      run: |
        if [[ -n $(git status -s feed/) ]]; then
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "LLM analysis added to feed"
        else
          echo "has_changes=false" >> $GITHUB_OUTPUT
          echo "No changes from LLM analysis"
        fi

    - name: Commit analysis results
      if: steps.check_changes.outputs.has_changes == 'true'
      run: |
        git config --global user.name 'LLM Analyzer Bot'
        git config --global user.email 'llm-bot@detectopod'
        git pull origin main --rebase
        git add feed/
        TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
        git commit -m "Add LLM analysis - $TIMESTAMP [skip ci]"
        git push

    - name: Analysis Summary
      if: always()
      run: |
        echo "### LLM Analysis Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Model**: Llama 3.3 70B" >> $GITHUB_STEP_SUMMARY
        echo "- **Time**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [[ -f feed/llm_analysis_stats.json ]]; then
          ANALYZED=$(cat feed/llm_analysis_stats.json | python -c "import sys, json; print(json.load(sys.stdin).get('analyzed_count', 0))" 2>/dev/null || echo "0")
          HIGH_CONF=$(cat feed/llm_analysis_stats.json | python -c "import sys, json; print(json.load(sys.stdin).get('high_confidence', 0))" 2>/dev/null || echo "0")
          FALSE_POS=$(cat feed/llm_analysis_stats.json | python -c "import sys, json; print(json.load(sys.stdin).get('false_positives', 0))" 2>/dev/null || echo "0")

          echo "**📊 Analysis Results:**" >> $GITHUB_STEP_SUMMARY
          echo "- Domains analyzed: **$ANALYZED**" >> $GITHUB_STEP_SUMMARY
          echo "- High confidence threats: **$HIGH_CONF** 🚨" >> $GITHUB_STEP_SUMMARY
          echo "- False positives removed: **$FALSE_POS** ✅" >> $GITHUB_STEP_SUMMARY
        fi
